<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>我的订单 — 校园二手交易</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<style>
  .card{border:none;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
  .order-card{border-left:4px solid #667eea;border-radius:8px;background:#fff;padding:1rem;margin-bottom:.75rem;}
</style>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body class="bg-light app-page">
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop-window text-primary"></i> 校园二手</a>
    <div>
      <a href="my-products.html" class="btn btn-outline-secondary btn-sm me-1">我的商品</a>
      <a href="#" class="btn btn-outline-danger btn-sm" id="btnLogout">退出</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h3 class="mb-4"><i class="bi bi-receipt text-primary"></i> 我的订单</h3>

  <ul class="nav nav-tabs mb-4" id="orderTab">
    <li class="nav-item">
      <button class="nav-link active" data-tab="buy">我买的</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-tab="sell">我卖的</button>
    </li>
  </ul>

  <div id="orderList">
    <div class="text-center"><div class="spinner-border text-primary"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=20260708-admin1"></script>
<script>
  if (!requireLogin()) {}
  document.getElementById('btnLogout').addEventListener('click', e => { e.preventDefault(); userApi.logout(); });

  let currentTab = 'buy';
  const urlParams = new URLSearchParams(location.search);
  const payResult = urlParams.get('pay');
  const focusOrderNo = urlParams.get('orderNo');

  async function loadOrders(tab) {
    currentTab = tab;
    const container = document.getElementById('orderList');
    container.innerHTML = '<div class="text-center"><div class="spinner-border text-primary"></div></div>';

    try {
      const orders = tab === 'buy'
        ? await orderApi.myBuyOrders()
        : await orderApi.mySellOrders();

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="text-center py-5">
            <i class="bi bi-inbox display-1 text-muted"></i>
            <p class="mt-3 text-muted">暂无订单</p>
          </div>`;
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="order-card shadow-sm ${o.orderNo === focusOrderNo ? 'border border-success border-2' : ''}" id="order-${o.id}" data-order-no="${o.orderNo}">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
              <div class="fw-semibold mb-1">
                <a href="product-detail.html?id=${o.productId}" class="text-decoration-none">
                  ${o.productTitle || ('商品 #' + o.productId)}
                </a>
              </div>
              <small class="text-muted">订单号：${o.orderNo}</small>
            </div>
            <div class="text-end">
              <div class="fs-5 fw-bold text-danger">¥${o.price}</div>
              ${statusLabel(o.status)}
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-2 flex-wrap gap-2">
            <small class="text-muted">
              ${tab === 'buy' ? '卖家：' + (o.sellerName || '-') : '买家：' + (o.buyerName || '-')}
              &nbsp;·&nbsp; ${formatDate(o.createdAt)}
            </small>
            <div class="d-flex gap-2">
              ${o.status === 'CREATED' && tab === 'buy' ? `
                <button class="btn btn-primary btn-sm" onclick="doPay('${o.orderNo}')">
                  <i class="bi bi-credit-card"></i> 去支付
                </button>
                <button class="btn btn-outline-secondary btn-sm" onclick="doCancel(${o.id})">取消</button>
              ` : ''}
            </div>
          </div>
          ${o.remark ? `<small class="text-muted">备注：${o.remark}</small>` : ''}
        </div>
      `).join('');
    } catch(err) {
      container.innerHTML = `<div class="text-danger">${err.message}</div>`;
    }
  }

  async function doPay(orderNo) {
    try { await paymentApi.pay(orderNo); }
    catch(err) { showToast(err.message, 'error'); }
  }

  async function doCancel(orderId) {
    if (!confirm('确认取消该订单？')) return;
    try {
      await orderApi.cancel(orderId);
      showToast('订单已取消');
      loadOrders(currentTab);
    } catch(err) { showToast(err.message, 'error'); }
  }

  // Tab 切换
  document.querySelectorAll('#orderTab .nav-link').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#orderTab .nav-link').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadOrders(btn.dataset.tab);
    });
  });

  async function refreshAfterPayment() {
    if (!payResult) {
      loadOrders('buy');
      return;
    }

    if (payResult === 'success') {
      showToast('支付成功，正在同步订单状态...');
    } else if (payResult === 'processing') {
      showToast('支付处理中，正在同步订单状态...', 'warning');
    }

    if (focusOrderNo) {
      try { await paymentApi.sync(focusOrderNo); } catch (err) { console.warn(err); }
    }

    await loadOrders('buy');
    history.replaceState(null, '', 'my-orders.html');

    const refreshDelays = [800, 2000, 4000];
    refreshDelays.forEach(delay => setTimeout(() => loadOrders('buy'), delay));
  }

  window.addEventListener('pageshow', event => {
    if (event.persisted) loadOrders(currentTab);
  });
  refreshAfterPayment();
</script>
</body>
</html>
