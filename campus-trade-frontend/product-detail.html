<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>商品详情 — 校园二手交易</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<style>
  .product-img{width:100%;max-height:420px;object-fit:cover;border-radius:12px;}
  .price{font-size:2rem;font-weight:700;color:#e53935;}
  .card{border:none;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
  .msg-item{border-bottom:1px solid #f0f0f0;padding:.6rem 0;}
  .msg-item:last-child{border-bottom:none;}
</style>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body class="bg-light app-page">

<!-- 导航 -->
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop-window text-primary"></i> 校园二手</a>
    <div id="navRight">
      <a href="login.html" class="btn btn-outline-primary btn-sm" id="navLogin">登录</a>
      <span id="navUser" class="d-none">
        <a href="my-orders.html" class="btn btn-outline-secondary btn-sm me-1">我的订单</a>
        <a href="#" class="btn btn-outline-danger btn-sm" id="btnLogout">退出</a>
      </span>
    </div>
  </div>
</nav>

<div class="container py-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="index.html">首页</a></li>
      <li class="breadcrumb-item active">商品详情</li>
    </ol>
  </nav>

  <div id="main" class="row g-4">
    <div class="col-12 text-center">
      <div class="spinner-border text-primary"></div>
    </div>
  </div>
</div>

<!-- 下单 Modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">确认购买</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2">商品：<strong id="modalTitle"></strong></p>
        <p class="mb-3">金额：<strong class="text-danger" id="modalPrice"></strong></p>
        <label class="form-label">备注（选填）</label>
        <textarea id="remark" class="form-control" rows="2" placeholder="如：线下交易地点等"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" id="btnConfirmOrder">确认下单</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=20260708-admin1"></script>
<script>
  const params  = new URLSearchParams(location.search);
  const id      = params.get('id');
  let product   = null;

  // 导航栏
  if (auth.isLoggedIn()) {
    document.getElementById('navLogin').classList.add('d-none');
    document.getElementById('navUser').classList.remove('d-none');
  }
  document.getElementById('btnLogout')?.addEventListener('click', e => { e.preventDefault(); userApi.logout(); });

  async function load() {
    if (!id) { location.href = 'index.html'; return; }
    try {
      product = await productApi.detail(id);
      const messages = await productApi.messages(id).catch(() => product.messages || []);
      const isMine    = auth.isLoggedIn() && auth.getUser().userId == product.sellerId;
      const canBuy    = auth.isLoggedIn() && !isMine && product.status === 'ON_SALE';
      const canMessage = auth.isLoggedIn() && product.status === 'ON_SALE';
      const canFavorite = auth.isLoggedIn() && !isMine && product.status === 'ON_SALE';
      const canOffline = isMine && product.status === 'ON_SALE';

      document.getElementById('main').innerHTML = `
        <div class="col-md-5">
          <img src="${productImageUrl(product.imageUrl)}"
               class="product-img detail-hero-image" alt="${product.title}"/>
        </div>
        <div class="col-md-7">
          <div class="card p-4 h-100">
            <h2 class="mb-2">${product.title}</h2>
            <div class="d-flex align-items-center gap-2 mb-3">
              <span class="price">¥${product.price}</span>
              ${statusLabel(product.status)}
            </div>
            <table class="table table-borderless table-sm mb-3">
              <tr><th style="width:80px">分类</th><td>${product.category || '-'}</td></tr>
              <tr><th>交易地点</th><td>${product.tradePlace || '-'}</td></tr>
              <tr><th>卖家</th><td>${product.sellerName || '-'}</td></tr>
              <tr><th>发布时间</th><td>${formatDate(product.createdAt)}</td></tr>
            </table>
            <p class="text-muted" style="white-space:pre-wrap">${product.description || '暂无描述'}</p>
            <div class="d-flex gap-2 mt-auto">
              ${canBuy ? `
                <button class="btn btn-danger flex-grow-1" id="btnBuy">
                  <i class="bi bi-cart-plus"></i> 立即购买
                </button>` : ''}
              ${canFavorite ? `
                <button class="btn btn-outline-danger" id="btnFav" title="收藏" aria-label="收藏商品">
                  <i class="bi bi-heart"></i>
                </button>` : ''}
              ${canOffline ? `
                <button class="btn btn-outline-secondary" id="btnOffline">
                  <i class="bi bi-eye-slash"></i> 下架
                </button>` : ''}
            </div>
          </div>
        </div>
        <!-- 留言区 -->
        <div class="col-12">
          <div class="card p-4">
            <h5 class="mb-3"><i class="bi bi-chat-dots"></i> 商品留言</h5>
            <div id="msgList">${renderMessages(messages)}</div>
            ${canMessage ? `
              <form id="msgForm" class="mt-3 d-flex gap-2">
                <input id="msgInput" type="text" class="form-control" placeholder="留言内容..." maxlength="300" required/>
                <button type="submit" class="btn btn-primary">发送</button>
              </form>` : renderMessageTip(product.status)}
          </div>
        </div>`;

      bindEvents();
    } catch(err) {
      document.getElementById('main').innerHTML = `<div class="col-12 text-danger">${err.message}</div>`;
    }
  }

  function bindEvents() {
    // 购买
    document.getElementById('btnBuy')?.addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = product.title;
      document.getElementById('modalPrice').textContent = '¥' + product.price;
      new bootstrap.Modal('#orderModal').show();
    });
    document.getElementById('btnConfirmOrder')?.addEventListener('click', async () => {
      try {
        const order = await orderApi.place(product.id, document.getElementById('remark').value);
        bootstrap.Modal.getInstance('#orderModal').hide();
        showToast('下单成功，即将跳转支付...');
        setTimeout(() => paymentApi.pay(order.orderNo), 1500);
      } catch(err) { showToast(err.message, 'error'); }
    });

    // 收藏
    document.getElementById('btnFav')?.addEventListener('click', async () => {
      if (!requireLogin()) return;
      try {
        const added = await productApi.toggleFavorite(id);
        showToast(added ? '已收藏' : '已取消收藏');
      } catch(err) { showToast(err.message, 'error'); }
    });

    // 下架
    document.getElementById('btnOffline')?.addEventListener('click', async () => {
      if (!confirm('确认下架此商品？')) return;
      try {
        await productApi.offline(id);
        showToast('已下架');
        setTimeout(() => location.href = 'my-products.html', 1500);
      } catch(err) { showToast(err.message, 'error'); }
    });

    // 留言提交
    document.getElementById('msgForm')?.addEventListener('submit', async e => {
      e.preventDefault();
      try {
        await productApi.addMessage(id, document.getElementById('msgInput').value.trim());
        document.getElementById('msgInput').value = '';
        showToast('留言成功');
        await load();
      } catch(err) { showToast(err.message, 'error'); }
    });
  }

  function renderMessages(messages) {
    if (!messages || messages.length === 0) {
      return '<p class="text-muted mb-0">暂无留言</p>';
    }
    return messages.map(m => `
      <div class="border-bottom py-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <strong>${escapeHtml(m.userName || '匿名用户')}</strong>
          <small class="text-muted">${formatDate(m.createdAt)}</small>
        </div>
        <div class="text-body">${escapeHtml(m.content || '')}</div>
      </div>
    `).join('');
  }

  function renderMessageTip(status) {
    if (!auth.isLoggedIn()) {
      return '<p class="text-muted mt-2 mb-0"><a href="login.html">登录</a>后可留言</p>';
    }
    const text = status === 'SOLD'
      ? '该商品已售出，不能继续留言'
      : status === 'OFFLINE'
        ? '该商品已下架，不能继续留言'
        : '该商品当前不可留言';
    return `<p class="text-muted mt-2 mb-0">${text}</p>`;
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  load();
</script>
</body>
</html>
