<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>我的商品 — 校园二手交易</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<style>
  .card{border:none;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
  .product-img{width:80px;height:80px;object-fit:cover;border-radius:8px;flex-shrink:0;}
</style>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body class="bg-light app-page">
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop-window text-primary"></i> 校园二手</a>
    <div>
      <a href="my-orders.html" class="btn btn-outline-secondary btn-sm me-1">我的订单</a>
      <a href="#" class="btn btn-outline-danger btn-sm" id="btnLogout">退出</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-box-seam text-primary"></i> 我的商品</h3>
    <a href="product-form.html" class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> 发布新商品
    </a>
  </div>

  <!-- Tab: 我发布的 / 我收藏的 -->
  <ul class="nav nav-tabs mb-4" id="myTab">
    <li class="nav-item">
      <button class="nav-link active" data-tab="my">我发布的</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-tab="fav">我收藏的</button>
    </li>
  </ul>

  <div id="list">
    <div class="text-center"><div class="spinner-border text-primary"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=20260708-admin1"></script>
<script>
  if (!requireLogin()) {}
  document.getElementById('btnLogout').addEventListener('click', e => { e.preventDefault(); userApi.logout(); });

  let currentTab = 'my';

  function renderProducts(products, showOffline = false) {
    const container = document.getElementById('list');
    if (!products || products.length === 0) {
      container.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-inbox display-1 text-muted"></i>
          <p class="mt-3 text-muted">暂无商品</p>
        </div>`;
      return;
    }
    container.innerHTML = products.map(p => `
      <div class="card p-3 mb-3 d-flex flex-row gap-3 align-items-center" id="product-${p.id}">
        <img src="${productImageUrl(p.imageUrl)}"
             class="product-img" alt="${p.title}" loading="lazy"/>
        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <a href="product-detail.html?id=${p.id}" class="fw-semibold text-decoration-none text-dark">
                ${p.title}
              </a>
              <div class="mt-1">${statusLabel(p.status)} <small class="text-muted ms-1">${p.category || ''}</small></div>
            </div>
            <div class="text-end ms-3">
              <div class="fw-bold text-danger">¥${p.price}</div>
              <small class="text-muted">${formatDate(p.createdAt)}</small>
            </div>
          </div>
        </div>
        ${showOffline && p.status === 'ON_SALE' ? `
          <button class="btn btn-outline-secondary btn-sm" onclick="doOffline(${p.id})" aria-label="下架${p.title}">
            <i class="bi bi-eye-slash"></i> 下架
          </button>` : ''}
        ${!showOffline ? `
          <button class="btn btn-outline-danger btn-sm" onclick="doUnfav(${p.id})" aria-label="取消收藏${p.title}">
            <i class="bi bi-heart-fill"></i>
          </button>` : ''}
      </div>
    `).join('');
  }

  async function load(tab) {
    currentTab = tab;
    const container = document.getElementById('list');
    container.innerHTML = '<div class="text-center"><div class="spinner-border text-primary"></div></div>';
    try {
      if (tab === 'my') {
        const data = await productApi.myProducts();
        renderProducts(data, true);
      } else {
        const data = await productApi.myFavorites();
        renderProducts(data, false);
      }
    } catch(err) {
      container.innerHTML = `<div class="text-danger">${err.message}</div>`;
    }
  }

  async function doOffline(id) {
    if (!confirm('确认下架该商品？')) return;
    try {
      await productApi.offline(id);
      showToast('已下架');
      load(currentTab);
    } catch(err) { showToast(err.message, 'error'); }
  }

  async function doUnfav(id) {
    try {
      await productApi.toggleFavorite(id);
      showToast('已取消收藏');
      load(currentTab);
    } catch(err) { showToast(err.message, 'error'); }
  }

  document.querySelectorAll('#myTab .nav-link').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#myTab .nav-link').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      load(btn.dataset.tab);
    });
  });

  load('my');
</script>
</body>
</html>
